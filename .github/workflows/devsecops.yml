name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to AWS Elastic Beanstalk after all security gates pass"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-and-security:
    name: Test, SAST & SCA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cybertek/requirements.txt

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r cybertek/requirements.txt
          pip install pytest pytest-cov flake8 bandit pip-audit

      - name: Lint
        run: flake8 cybertek tests --select=E9,F63,F7,F82

      - name: Unit tests
        env:
          SECRET_KEY: test-only-ci-secret
        run: pytest -q --cov=cybertek --cov-report=term-missing tests/

      - name: SAST - Bandit
        run: bandit -r cybertek -s B104 -ll

      - name: SCA - pip-audit
        run: pip-audit -r cybertek/requirements.txt

  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-security:
    name: Build & Container Scan
    runs-on: ubuntu-latest
    needs: [test-and-security, secrets-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build container image
        run: docker build --pull -t cybertek:${{ github.sha }} .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cybertek:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  deploy:
    name: Optional AWS Deployment
    runs-on: ubuntu-latest
    needs: container-security
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package application
        run: |
          zip -r deploy.zip Dockerfile .dockerignore cybertek run.py \
            -x "*__pycache__*" "*.pyc" "*.db" ".env*"

      - name: Upload deployment bundle
        run: |
          aws s3 cp deploy.zip "s3://${{ vars.EB_S3_BUCKET }}/deploy-${{ github.run_id }}.zip" --no-progress

      - name: Create Elastic Beanstalk application version
        env:
          VERSION_LABEL: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ vars.EB_APP_NAME }}" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="${{ vars.EB_S3_BUCKET }}",S3Key="deploy-${{ github.run_id }}.zip"

      - name: Deploy application version
        env:
          VERSION_LABEL: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ vars.EB_ENV_NAME }}" \
            --version-label "$VERSION_LABEL"
